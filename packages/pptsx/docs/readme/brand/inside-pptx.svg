<rect x="515" y="104" width="146.0" height="30" rx="15" fill="#FFFFFF" stroke="#E2E6F3"/><text x="588" y="123.5" font-size="12.5" font-weight="600" fill="#0B1020" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">fixPart × partes</text><path d="M667 119 L691 119" stroke="#8A93B8" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect x="697" y="104" width="146.0" height="30" rx="15" fill="#FFFFFF" stroke="#E2E6F3"/><text x="770" y="123.5" font-size="12.5" font-weight="600" fill="#0B1020" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">DEFLATE → Buffer</text>
