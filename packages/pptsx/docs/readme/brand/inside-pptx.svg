<rect x="173.5" y="104" width="138.5" height="30" rx="15" fill="#FFFFFF" stroke="#E2E6F3"/><text x="242.75" y="123.5" font-size="12.5" font-weight="600" fill="#0B1020" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">JSZip.loadAsync</text><path d="M318 119 L342 119" stroke="#8A93B8" stroke-width="2" fill="none" marker-end="url(#ah)"/>
