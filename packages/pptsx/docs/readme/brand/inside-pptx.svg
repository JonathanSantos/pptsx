<g filter="url(#sh)"><rect x="588" y="272" width="648" height="100" rx="14" fill="#FFFFFF" stroke="#E2E6F3"/></g><circle cx="616" cy="302" r="13" fill="url(#grad)"/><text x="616" y="306.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">2</text><text x="640" y="307" font-size="13" font-weight="700" fill="#4F5BFF" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">slideN.xml</text><text x="732" y="307" font-size="15" font-weight="700" fill="#0B1020" xml:space="preserve">um &lt;a:pPr&gt; por parágrafo</text><text x="616" y="334" font-size="13" font-weight="400" fill="#5A6385" xml:space="preserve">o pptxgenjs repete o pPr a cada run; também aplica marcadores de linha e o campo do nº do</text><text x="616" y="353" font-size="13" font-weight="400" fill="#5A6385" xml:space="preserve">slide</text>
<g filter="url(#sh)"><rect x="588" y="386" width="648" height="100" rx="14" fill="#FFFFFF" stroke="#E2E6F3"/></g><circle cx="616" cy="416" r="13" fill="url(#grad)"/><text x="616" y="420.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">3</text><text x="640" y="421" font-size="13" font-weight="700" fill="#4F5BFF" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">chartN.xml</text><text x="732" y="421" font-size="15" font-weight="700" fill="#0B1020" xml:space="preserve">renumerado 1..n · sem ponto vazio</text><text x="616" y="448" font-size="13" font-weight="400" fill="#5A6385" xml:space="preserve">o contador do pptxgenjs não zera entre arquivos; o Keynote lia &lt;c:v&gt;&lt;/c:v&gt; como 0</text>
