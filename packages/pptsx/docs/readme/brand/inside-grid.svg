<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>pptsx: motor de grid, cálculo dos tracks e posicionamento com span</title>
<defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4F5BFF"/><stop offset=".55" stop-color="#C246D8"/><stop offset="1" stop-color="#FF6A3D"/></linearGradient><linearGradient id="gradH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4F5BFF"/><stop offset=".55" stop-color="#C246D8"/><stop offset="1" stop-color="#FF6A3D"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0B1020" flood-opacity="0.08"/></filter><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8A93B8"/></marker><linearGradient id="gradV" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#4F5BFF"/><stop offset=".55" stop-color="#C246D8"/><stop offset="1" stop-color="#FF6A3D"/></linearGradient><filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B1020" flood-opacity="0.28"/></filter><filter id="slideShadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0B1020" flood-opacity="0.14"/></filter></defs>
<rect width="1280" height="600" rx="22" fill="#F7F8FD"/><rect x=".5" y=".5" width="1279" height="599" rx="21.5" fill="none" stroke="#E2E6F3"/>
<text x="44" y="50" font-size="12" font-weight="700" fill="#5A6385" letter-spacing="1.8" xml:space="preserve">O MOTOR DE GRID</text><text x="44" y="82" font-size="17" font-weight="600" fill="#0B1020" xml:space="preserve">Os tracks seguem o algoritmo do CSS Grid; depois, cada item ocupa a sua célula (com span).</text>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#F7F8FD"/><line x1="0" y1="0" x2="0" y2="6" stroke="#8A93B8" stroke-width="1.5" opacity=".5"/></pattern></defs>
<text x="44" y="120" font-size="13" font-weight="400" fill="#4F5BFF" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">&lt;Box display=&quot;grid&quot; width={640} gap={16} gridTemplateColumns=&quot;200 minmax(0, 1fr) 2fr&quot;&gt;</text>
<text x="44" y="204" font-size="11.5" font-weight="700" fill="#5A6385" letter-spacing="1.6" xml:space="preserve">TRACKS</text>
<rect x="140" y="176" width="312.5" height="46" rx="8" fill="#8A93B8" fill-opacity=".12" stroke="#8A93B8" stroke-opacity=".6"/><text x="296.25" y="166" font-size="12.5" font-weight="700" fill="#8A93B8" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">200</text><text x="296.25" y="204" font-size="15" font-weight="700" fill="#0B1020" text-anchor="middle" xml:space="preserve">200 pt</text><text x="296.25" y="240" font-size="11.5" font-weight="400" fill="#5A6385" text-anchor="middle" xml:space="preserve">fixo</text><rect x="452.5" y="176" width="25" height="46" fill="url(#hatch)"/>
<rect x="477.5" y="176" width="212.5" height="46" rx="8" fill="#4F5BFF" fill-opacity=".12" stroke="#4F5BFF" stroke-opacity=".6"/><text x="583.75" y="166" font-size="12.5" font-weight="700" fill="#4F5BFF" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">minmax(0, 1fr)</text><text x="583.75" y="204" font-size="15" font-weight="700" fill="#0B1020" text-anchor="middle" xml:space="preserve">136 pt</text><text x="583.75" y="240" font-size="11.5" font-weight="400" fill="#5A6385" text-anchor="middle" xml:space="preserve">1fr</text><rect x="690" y="176" width="25" height="46" fill="url(#hatch)"/>
<rect x="715" y="176" width="425" height="46" rx="8" fill="#C246D8" fill-opacity=".12" stroke="#C246D8" stroke-opacity=".6"/><text x="927.5" y="166" font-size="12.5" font-weight="700" fill="#C246D8" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">2fr</text><text x="927.5" y="204" font-size="15" font-weight="700" fill="#0B1020" text-anchor="middle" xml:space="preserve">272 pt</text><text x="927.5" y="240" font-size="11.5" font-weight="400" fill="#5A6385" text-anchor="middle" xml:space="preserve">2fr</text>
<path d="M140 254 v6 H1140 v-6" fill="none" stroke="#8A93B8"/>
<text x="640" y="278" font-size="12.5" font-weight="700" fill="#0B1020" text-anchor="middle" xml:space="preserve">640 pt</text>
<text x="44" y="330" font-size="11.5" font-weight="700" fill="#5A6385" letter-spacing="1.6" xml:space="preserve">ITENS</text>
<g filter="url(#sh)"><rect x="140" y="300" width="312.5" height="54" rx="8" fill="#FFFFFF"/></g><rect x="140" y="300" width="312.5" height="54" rx="8" fill="none" stroke="#4F5BFF" stroke-opacity=".5"/><text x="154" y="325" font-size="15" font-weight="700" fill="#0B1020" xml:space="preserve">A</text>
<g filter="url(#sh)"><rect x="477.5" y="300" width="212.5" height="54" rx="8" fill="#FFFFFF"/></g><rect x="477.5" y="300" width="212.5" height="54" rx="8" fill="none" stroke="#4F5BFF" stroke-opacity=".5"/><text x="491.5" y="325" font-size="15" font-weight="700" fill="#0B1020" xml:space="preserve">B</text>
<g filter="url(#sh)"><rect x="715" y="300" width="425" height="54" rx="8" fill="#FFFFFF"/></g><rect x="715" y="300" width="425" height="54" rx="8" fill="none" stroke="#4F5BFF" stroke-opacity=".5"/><text x="729" y="325" font-size="15" font-weight="700" fill="#0B1020" xml:space="preserve">C</text>
<g filter="url(#sh)"><rect x="140" y="370" width="550" height="54" rx="8" fill="#FFFFFF"/></g><rect x="140" y="370" width="550" height="54" rx="8" fill="none" stroke="#C246D8" stroke-opacity=".5"/><text x="154" y="395" font-size="15" font-weight="700" fill="#0B1020" xml:space="preserve">D</text><text x="154" y="414" font-size="11.5" font-weight="400" fill="#C246D8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">gridColumn=&quot;span 2&quot;</text>
<g filter="url(#sh)"><rect x="715" y="370" width="425" height="54" rx="8" fill="#FFFFFF"/></g><rect x="715" y="370" width="425" height="54" rx="8" fill="none" stroke="#4F5BFF" stroke-opacity=".5"/><text x="729" y="395" font-size="15" font-weight="700" fill="#0B1020" xml:space="preserve">E</text>
<text x="1154" y="332" font-size="11.5" font-weight="400" fill="#5A6385" xml:space="preserve">linha 1</text>
<text x="1154" y="402" font-size="11.5" font-weight="400" fill="#5A6385" xml:space="preserve">linha 2</text>
<rect x="44" y="456" width="288" height="80" rx="14" fill="#FFFFFF" stroke="#E2E6F3"/><text x="62" y="486" font-size="13" font-weight="700" fill="#5A6385" xml:space="preserve">1 · fixos primeiro</text><text x="62" y="516" font-size="15" font-weight="700" fill="#0B1020" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">200 pt</text>
<rect x="344" y="456" width="288" height="80" rx="14" fill="#FFFFFF" stroke="#E2E6F3"/><text x="362" y="486" font-size="13" font-weight="700" fill="#5A6385" xml:space="preserve">2 · gaps</text><text x="362" y="516" font-size="15" font-weight="700" fill="#0B1020" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">2 × 16 = 32 pt</text>
<rect x="644" y="456" width="288" height="80" rx="14" fill="#FFFFFF" stroke="#E2E6F3"/><text x="662" y="486" font-size="13" font-weight="700" fill="#5A6385" xml:space="preserve">3 · o que sobra</text><text x="662" y="516" font-size="15" font-weight="700" fill="#0B1020" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">640 − 200 − 32 = 408 pt</text>
<rect x="944" y="456" width="288" height="80" rx="14" fill="#FFFFFF" stroke="#E2E6F3"/><text x="962" y="486" font-size="13" font-weight="700" fill="#5A6385" xml:space="preserve">4 · frações</text><text x="962" y="516" font-size="15" font-weight="700" fill="#4F5BFF" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">1fr = 408 ÷ 3 = 136 pt</text>
<text x="44" y="572" font-size="13" font-weight="400" fill="#5A6385" xml:space="preserve">minmax(0, 1fr) deixa a coluna encolher abaixo do conteúdo; um 1fr solto tem mínimo auto (o lint avisa). Contra o Chrome: 47/48 casos em ±1 pt.</text>
</svg>
