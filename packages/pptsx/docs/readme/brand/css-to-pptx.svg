458" r="3.5" fill="#14B87F"/><text x="88" y="463" font-size="14" font-weight="400" fill="#0B1020" xml:space="preserve">Chart (12 kinds) · Table</text><circle cx="74" cy="489" r="3.5" fill="#14B87F"/><text x="88" y="494" font-size="14" font-weight="400" fill="#0B1020" xml:space="preserve">24 formas · Path · Icon · Connector</text>
