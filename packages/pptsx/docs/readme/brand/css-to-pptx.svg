<text x="44" y="50" font-size="12" font-weight="700" fill="#5A6385" letter-spacing="1.8" xml:space="preserve">DE/PARA CSS → PPTX</text>
<text x="44" y="82" font-size="17" font-weight="600" fill="#0B1020" xml:space="preserve">O preview desenha só o que o .pptx tem: o PNG nunca promete mais do que o arquivo entrega.</text>
