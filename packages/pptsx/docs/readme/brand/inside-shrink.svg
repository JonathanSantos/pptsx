<rect x="320" y="166" width="167.6" height="163" rx="12" fill="none" stroke="#C246D8" stroke-dasharray="5 4"/><text x="328" y="184" font-size="11.5" font-weight="700" fill="#C246D8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">Quote[1]</text><rect x="330" y="196" width="147.6" height="122.99999999999999" fill="#EEF1FA"/><text x="343.12" y="220.06" font-size="13.94" font-weight="400" fill="#0B1020" xml:space="preserve">O catálogo de</text><text x="343.12" y="236.788" font-size="13.94" font-weight="400" fill="#0B1020" xml:space="preserve">dados reduziu</text><text x="343.12" y="253.51600000000002" font-size="13.94" font-weight="400" fill="#0B1020" xml:space="preserve">pela metade o</text><text x="343.12" y="270.244" font-size="13.94" font-weight="400" fill="#0B1020" xml:space="preserve">tempo para achar</text><text x="343.12" y="286.972" font-size="13.94" font-weight="400" fill="#0B1020" xml:space="preserve">uma tabela</text><text x="343.12" y="303.7" font-size="13.94" font-weight="400" fill="#0B1020" xml:space="preserve">confiável.</text><text x="330" y="345" font-size="13" font-weight="700" fill="#C246D8" xml:space="preserve">22 → 17 pt (text-shrunk)</text>
