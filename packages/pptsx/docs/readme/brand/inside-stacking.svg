<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" width="1280" height="620" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>pptsx: ordem de pintura em camadas (zIndex, fluxo, posicionados)</title>
<defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4F5BFF"/><stop offset=".55" stop-color="#C246D8"/><stop offset="1" stop-color="#FF6A3D"/></linearGradient><linearGradient id="gradH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4F5BFF"/><stop offset=".55" stop-color="#C246D8"/><stop offset="1" stop-color="#FF6A3D"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0B1020" flood-opacity="0.08"/></filter><linearGradient id="gradV" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#4F5BFF"/><stop offset=".55" stop-color="#C246D8"/><stop offset="1" stop-color="#FF6A3D"/></linearGradient><filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B1020" flood-opacity="0.28"/></filter><filter id="slideShadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0B1020" flood-opacity="0.14"/></filter></defs>
<rect width="1280" height="620" rx="22" fill="#F7F8FD"/><rect x=".5" y=".5" width="1279" height="619" rx="21.5" fill="none" stroke="#E2E6F3"/>
<text x="44" y="50" font-size="12" font-weight="700" fill="#5A6385" letter-spacing="1.8" xml:space="preserve">ORDEM DE PINTURA</text><text x="44" y="82" font-size="17" font-weight="600" fill="#0B1020" xml:space="preserve">As regras do CSS (Apêndice E) decidem a camada; no .pptx, a camada vira a ordem dos objetos no slide.</text>
<g transform="matrix(1 0 1.0000 -0.4267 70 560)"><rect width="480" height="150" rx="6" fill="#FFFFFF" fill-opacity=".55" stroke="#8A93B8" stroke-opacity=".7"/><rect width="480" height="150" fill="#1B2A4A" fill-opacity=".9"/></g><circle cx="48" cy="556" r="12" fill="#8A93B8"/><text x="48" y="560.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">1</text>
