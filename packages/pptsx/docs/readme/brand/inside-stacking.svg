<g transform="matrix(1 0 1.0000 -0.4267 70 308)"><rect width="480" height="150" rx="6" fill="#FFFFFF" fill-opacity=".55" stroke="#C246D8" stroke-opacity=".7"/><rect x="300" y="40" width="80" height="80" rx="8" fill="#C246D8" fill-opacity=".55" transform="rotate(18 340 80)"/></g><circle cx="48" cy="304" r="12" fill="#C246D8"/><text x="48" y="308.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">4</text>
<g transform="matrix(1 0 1.0000 -0.4267 70 224)"><rect width="480" height="150" rx="6" fill="#FFFFFF" fill-opacity=".55" stroke="#FF6A3D" stroke-opacity=".7"/><rect x="360" y="110" width="96" height="28" rx="14" fill="#FF6A3D"/></g><circle cx="48" cy="220" r="12" fill="#FF6A3D"/><text x="48" y="224.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">5</text>
<rect x="760" y="380" width="476" height="50" rx="12" fill="#FFFFFF" stroke="#E2E6F3"/><rect x="760" y="380" width="5" height="50" rx="2.5" fill="#8A93B8"/><text x="782" y="402" font-size="14.5" font-weight="700" fill="#0B1020" xml:space="preserve">1 · fundo do slide</text><text x="782" y="420" font-size="12.5" font-weight="400" fill="#5A6385" xml:space="preserve">backgroundColor do Slide</text>
<rect x="760" y="318" width="476" height="50" rx="12" fill="#FFFFFF" stroke="#E2E6F3"/><rect x="760" y="318" width="5" height="50" rx="2.5" fill="#4F5BFF"/><text x="782" y="340" font-size="14.5" font-weight="700" fill="#0B1020" xml:space="preserve">2 · zIndex negativo</text><text x="782" y="358" font-size="12.5" font-weight="400" fill="#5A6385" xml:space="preserve">decoração atrás do conteúdo</text>
<rect x="760" y="256" width="476" height="50" rx="12" fill="#FFFFFF" stroke="#E2E6F3"/><rect x="760" y="256" width="5" height="50" rx="2.5" fill="#0B1020"/><text x="782" y="278" font-size="14.5" font-weight="700" fill="#0B1020" xml:space="preserve">3 · fluxo normal</text><text x="782" y="296" font-size="12.5" font-weight="400" fill="#5A6385" xml:space="preserve">Box, Text, Chart na ordem do código</text>
<rect x="760" y="194" width="476" height="50" rx="12" fill="#FFFFFF" stroke="#E2E6F3"/><rect x="760" y="194" width="5" height="50" rx="2.5" fill="#C246D8"/><text x="782" y="216" font-size="14.5" font-weight="700" fill="#0B1020" xml:space="preserve">4 · posicionados, opacity, rotate</text><text x="782" y="234" font-size="12.5" font-weight="400" fill="#5A6385" xml:space="preserve">sobem de camada (z 0/auto), na ordem do código</text>
<rect x="760" y="132" width="476" height="50" rx="12" fill="#FFFFFF" stroke="#E2E6F3"/><rect x="760" y="132" width="5" height="50" rx="2.5" fill="#FF6A3D"/><text x="782" y="154" font-size="14.5" font-weight="700" fill="#0B1020" xml:space="preserve">5 · zIndex positivo</text><text x="782" y="172" font-size="12.5" font-weight="400" fill="#5A6385" xml:space="preserve">por último, z crescente</text>
<rect x="760" y="452" width="476" height="136" rx="16" fill="#F1F2FF" stroke="#D9DCFF"/>
<text x="782" y="482" font-size="15" font-weight="700" fill="#4F5BFF" xml:space="preserve">Uma lista, dois desenhistas</text>
<text x="782" y="508" font-size="13" font-weight="400" fill="#5A6385" xml:space="preserve">O emissor e o preview percorrem os mesmos PaintItems (nó,</text>
<text x="782" y="527" font-size="13" font-weight="400" fill="#5A6385" xml:space="preserve">opacidade efetiva, rotações herdadas), nunca a árvore: o PNG e o</text>
<text x="782" y="546" font-size="13" font-weight="400" fill="#5A6385" xml:space="preserve">.pptx pintam igual, na mesma ordem.</text>
