# M18-5: publicação por tag (`v1.0.0`) com provenance — o npm valida a origem pelo OIDC do GitHub Actions.
# Antes do primeiro uso o dono precisa: tirar `private` do núcleo, preencher `repository` nos três pacotes e
# configurar o "trusted publisher" de cada pacote no npmjs.com (ou o segredo NPM_TOKEN). Ver docs/work/VALIDACAO-DONO.md.
name: Publicar

on:
  push:
    tags: ['v*']

permissions:
  # contents: write para anexar o bundle à release da tag.
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing (OIDC sem token) precisa do npm 11.5+.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:package
      - name: Campos e dry-run, agora com os itens do dono
        run: node scripts/publish-check.mjs --strict
      - name: Bundle de arquivo único (paridade com o build normal)
        run: npm run test:standalone --workspace pptsx
      - name: Publicar os três (núcleo antes dos DS, na ordem dos workspaces)
        run: npm publish --workspaces --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # M18-8: as skills saem do repo na hora (guia, props, SHA256 do bundle desta tag), nunca escritas à mão.
      - name: Skills (pptsx e ds-base)
        run: |
          node packages/pptsx/bin/pptsx.mjs skill --out dist/skill
          node packages/ds-kit/bin/pptsx-ds.mjs skill packages/ds-base/src/ds.ts --out dist/skill-ds-base
          (cd dist/skill/.claude/skills && zip -r ../../../pptsx-skill.zip pptsx)
          (cd dist/skill-ds-base/.claude/skills && zip -r ../../../ds-base-skill.zip pptsx-ds-base)
      # M18-7: o pptsx.mjs (Node 20+, sem node_modules) e o SHA256SUMS que o script da skill confere.
      - name: Release com o bundle e as skills
        run: gh release create "$GITHUB_REF_NAME" packages/pptsx/dist/standalone/pptsx.mjs packages/pptsx/dist/standalone/SHA256SUMS dist/pptsx-skill.zip dist/ds-base-skill.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
