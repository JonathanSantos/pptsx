# O motor é o binário em Rust (packages/pptsx-rs) e o CI é só dele: build, clippy sem avisos e os testes
# (unitários, grupo de fit e os decks dourados de fixtures/). Não precisa de Node: o design system de exemplo
# é resolvido pelo `workspaces` do package.json e o @pptsx/ds-kit é embutido no binário.
# Roda uma vez por commit: no push da main e em cada PR. Tags não disparam o CI: o workflow Release confere
# que este CI já passou no mesmo commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# Num PR, um push novo cancela o run anterior. Na main o grupo é o commit: nenhum run fica pendente e é
# descartado por outro, porque a Release espera o run do commit da tag.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # As fixtures são comparadas byte a byte: nada de CRLF no checkout (ver .gitattributes).
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Clippy sem avisos
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Testes
        run: cargo test
      - name: O binário gera o deck de exemplo do README
        run: |
          mkdir -p /tmp/exemplo && cp packages/pptsx-rs/docs/exemplo.tsx /tmp/exemplo/deck.tsx
          ./target/release/pptsx-rs build /tmp/exemplo/deck.tsx --size 16x9,4x3 --out /tmp/exemplo/dist
