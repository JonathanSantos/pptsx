# M16-6/M17/M18-5: a suíte dos três pacotes (npm workspaces) em cada push e PR, em macOS, Ubuntu e Windows
# com Node 20 e 22. Keynote/PowerPoint ficam fora.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    # Windows ainda experimental (VALIDACAO-DONO §3.1): falha ali não derruba o CI.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      # Fixtures e snapshots são comparados byte a byte: nada de CRLF no checkout do Windows (ver .gitattributes).
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Antes dos testes: os pacotes se importam pelo nome, e o `exports` aponta para dist/.
      - name: Build dos pacotes
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Lint do repo (variáveis e parâmetros sem uso)
        run: npm run lint:repo
      - name: Testes
        run: npm test
      - name: Teste dos pacotes empacotados (os três)
        run: npm run test:package
      - name: npm publish --dry-run dos três
        run: npm run publish:check
      - name: Bundle de arquivo único × build normal (XML, PNG, tempo)
        run: npm run test:standalone --workspace pptsx
      - name: npm audit
        run: npm audit --audit-level=high

  gallery:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: PNGs da galeria
        run: |
          for deck in packages/ds-base/examples/gallery/*.tsx; do
            node packages/pptsx/bin/pptsx.mjs build "$deck" --size 16x9,4x3 --out dist/gallery
          done
      - name: Catálogo do ds-base confere com as fixtures
        run: node packages/ds-kit/bin/pptsx-ds.mjs catalog packages/ds-base/src/ds.ts --check --fixtures packages/ds-base/fixtures
      - uses: actions/upload-artifact@v4
        with:
          name: galeria
          path: |
            dist/gallery/*.overview.png
            dist/gallery/*.pptx
            dist/gallery/*.diagnostics.json
