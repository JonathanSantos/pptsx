# Release por tag (`v1.0.1`): a release do GitHub com o pptsx.mjs (arquivo único, Node 20+, sem node_modules),
# o SHA256SUMS que o script da skill confere e os zips das skills; depois o npm.
# Não roda a suíte de novo: o job `gate` exige que o workflow CI tenha passado no mesmo commit (o push da main).
# Fluxo: commit com a versão nova → push da main → tag `v<versão>` → push da tag (a Release espera o CI, se ainda roda).
# A tag tem de ser a versão do núcleo (packages/pptsx/package.json): a skill baixa de
# `…/releases/download/v<versão>`, montado a partir do `repository` desse package.json.
# O npm só publica com o segredo NPM_TOKEN (ver docs/work/VALIDACAO-DONO.md §3.2).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # actions: read para ler e acompanhar os runs do CI deste commit.
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Tag igual à versão do núcleo
        run: |
          version="v$(node -p "require('./packages/pptsx/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::a tag $GITHUB_REF_NAME não bate com a versão do núcleo ($version)"
            exit 1
          fi
      - name: CI verde neste commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Um commit pode ter vários runs do CI (re-runs, PR): basta um verde; se não, espera o que ainda roda.
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" \
            --jq '.workflow_runs[] | select(.name == "CI") | "\(.id) \(.status) \(.conclusion)"')
          echo "${runs:-nenhum run do CI}"
          if grep -q ' completed success$' <<<"$runs"; then
            exit 0
          fi
          pending=$(awk '$2 != "completed" { print $1; exit }' <<<"$runs")
          if [ -n "$pending" ]; then
            gh run watch "$pending" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30
            exit 0
          fi
          echo "::error::sem CI verde no commit $GITHUB_SHA; faça o push da main, espere o CI e só então a tag"
          exit 1

  release:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # contents: write para criar a release da tag.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # As skills leem o dist/ dos pacotes; a paridade do bundle já passou no CI deste commit.
      - run: npm run build
      - name: Bundle de arquivo único (pptsx.mjs e SHA256SUMS)
        run: npm run build:standalone --workspace pptsx
      # M18-8: as skills saem do repo na hora (guia, props, SHA256 do bundle desta tag), nunca escritas à mão.
      - name: Skills (pptsx e ds-base)
        run: |
          node packages/pptsx/bin/pptsx.mjs skill --out dist/skill
          node packages/ds-kit/bin/pptsx-ds.mjs skill packages/ds-base/src/ds.ts --out dist/skill-ds-base
          (cd dist/skill/.claude/skills && zip -r ../../../pptsx-skill.zip pptsx)
          (cd dist/skill-ds-base/.claude/skills && zip -r ../../../ds-base-skill.zip pptsx-ds-base)
      # M18-7: o pptsx.mjs e o SHA256SUMS que o script da skill confere.
      - name: Release com o bundle e as skills
        run: gh release create "$GITHUB_REF_NAME" packages/pptsx/dist/standalone/pptsx.mjs packages/pptsx/dist/standalone/SHA256SUMS dist/pptsx-skill.zip dist/ds-base-skill.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  # Sem o segredo NPM_TOKEN o job termina sem publicar.
  npm:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Sem NPM_TOKEN, nada a publicar
        if: env.NODE_AUTH_TOKEN == ''
        run: echo "NPM_TOKEN não configurado; a release do GitHub já saiu e o npm fica para depois."
      - uses: actions/checkout@v4
        if: env.NODE_AUTH_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.NODE_AUTH_TOKEN != ''
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - if: env.NODE_AUTH_TOKEN != ''
        run: npm install -g npm@11 && npm ci && npm run build
      - name: Campos e dry-run, agora com os itens do dono
        if: env.NODE_AUTH_TOKEN != ''
        run: node scripts/publish-check.mjs --strict
      - name: Publicar os três (núcleo antes dos DS, na ordem dos workspaces)
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --workspaces --provenance --access public
