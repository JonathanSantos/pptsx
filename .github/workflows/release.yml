# Release por tag (`v1.1.3`): a release do GitHub com a skill do pptsx-rs por plataforma (pasta `pptsx/` com
# SKILL.md, references/, mcp/ e o binário em bin/; macOS arm64/x86_64, Linux x86_64/arm64, Windows x86_64) e o
# SHA256SUMS dos pacotes. Só o binário em Rust é publicado; os pacotes TypeScript são legado e não saem daqui.
# Não roda a suíte de novo: o job `gate` exige que o workflow CI tenha passado no mesmo commit (o push da main).
# Fluxo: commit com a versão nova → push da main → tag `v<versão>` → push da tag (a Release espera o CI, se ainda roda).
# A tag tem de ser a versão de packages/pptsx-rs/Cargo.toml.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # actions: read para ler e acompanhar os runs do CI deste commit.
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Tag igual à versão do pptsx-rs
        run: |
          version="v$(grep -m1 '^version' packages/pptsx-rs/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::a tag $GITHUB_REF_NAME não bate com a versão do pptsx-rs ($version)"
            exit 1
          fi
      - name: CI verde neste commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Um commit pode ter vários runs do CI (re-runs, PR): basta um verde; se não, espera o que ainda roda.
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" \
            --jq '.workflow_runs[] | select(.name == "CI") | "\(.id) \(.status) \(.conclusion)"')
          echo "${runs:-nenhum run do CI}"
          if grep -q ' completed success$' <<<"$runs"; then
            exit 0
          fi
          pending=$(awk '$2 != "completed" { print $1; exit }' <<<"$runs")
          if [ -n "$pending" ]; then
            gh run watch "$pending" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30
            exit 0
          fi
          echo "::error::sem CI verde no commit $GITHUB_SHA; faça o push da main, espere o CI e só então a tag"
          exit 1

  # Binários do pptsx-rs, um por alvo. O x86_64 do macOS é cross-compilado no runner arm64 (toolchain da Apple).
  binaries:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Dois builds: o do alvo (vai no pacote) e o da máquina (gera a skill; o alvo pode não rodar aqui).
      - run: cargo build --release -p pptsx-rs --target ${{ matrix.target }}
      - run: cargo build --release -p pptsx-rs
      - name: Empacotar a skill (pasta pptsx/ com o binário em bin/; tar.gz, zip no Windows)
        shell: bash
        run: |
          set -euo pipefail
          name="pptsx-rs-${{ matrix.target }}"
          case "${{ matrix.target }}" in
            *windows*) bin="target/${{ matrix.target }}/release/pptsx-rs.exe"; host="target/release/pptsx-rs.exe" ;;
            *) bin="target/${{ matrix.target }}/release/pptsx-rs"; host="target/release/pptsx-rs" ;;
          esac
          mkdir -p dist
          "$host" skill --out dist/pptsx --bin "$bin"
          cp LICENSE dist/pptsx/
          case "${{ matrix.target }}" in
            *windows*) (cd dist && 7z a -tzip "$name.zip" pptsx >/dev/null) ;;
            *) tar -czf "dist/$name.tar.gz" -C dist pptsx ;;
          esac
          ls -la dist dist/pptsx dist/pptsx/bin
      - uses: actions/upload-artifact@v4
        with:
          name: pptsx-rs-${{ matrix.target }}
          path: |
            dist/pptsx-rs-*.tar.gz
            dist/pptsx-rs-*.zip
          if-no-files-found: error

  release:
    needs: [gate, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # contents: write para criar a release da tag.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pptsx-rs-*
          path: dist/bin
          merge-multiple: true
      - name: SHA256SUMS dos pacotes
        run: |
          (cd dist/bin && sha256sum pptsx-rs-* > SHA256SUMS)
          cat dist/bin/SHA256SUMS
      - name: Release com os pacotes por plataforma
        run: gh release create "$GITHUB_REF_NAME" dist/bin/pptsx-rs-* dist/bin/SHA256SUMS --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
